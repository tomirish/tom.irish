version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    # init and analyze must move together — CodeQL fails with a configuration
    # error if the two steps run different versions of the action.
    groups:
      codeql-action:
        patterns: ['github/codeql-action*']

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
