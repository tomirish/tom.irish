name: Build, Test, Deploy

on:
  push:
    branches:
      - main
    # Docs-only pushes skip this pipeline. NARROW NAMED PATHS ONLY — this is a
    # deploy repo and markdown is production content (resume.md must keep
    # triggering deploys), so a '*.md' glob here would silently skip real
    # deploys. docs/ verified 2026-08-27: pure documentation, never read by
    # the build. Skips only when EVERY changed file matches; a skipped
    # docs-only push deploys nothing and the next code push carries it.
    paths-ignore:
      - 'todo.md'
      - 'CLAUDE.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build, Test, Deploy
    runs-on: ubuntu-latest
    # A healthy run is under 2 minutes. Without a cap a stalled step bills up
    # to GitHub's 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Python setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      # --with-deps runs apt for chromium's system libraries on every build, and
      # a runner's apt mirror can stall: 2026-11-06 this step sat 6+ minutes
      # (normally ~17s) and nothing stopped it. Each try is cut off at 3
      # minutes and retried once; the step itself is capped on top.
      - name: Install Playwright browsers
        timeout-minutes: 8
        run: |
          for attempt in 1 2; do
            timeout 180 playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $attempt timed out or failed"
          done
          exit 1

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --cache-dir /tmp/pip-audit-cache

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies for known vulnerabilities
        run: npm audit

      - name: Lint CSS
        run: npx stylelint "src/*.css"

      - name: Lint Python
        run: ruff check scripts/build/ scripts/tools/ tests/

      - name: Type-check Python
        run: mypy scripts/build/ scripts/tools/

      - name: Validate resume format
        run: |
          python scripts/build/validate_resume.py

      - name: Check links in resume
        run: |
          python scripts/build/check_links.py

      - name: Convert markdown to HTML
        run: |
          python scripts/build/convert_resume.py

      - name: Generate PDF and share image
        run: |
          python scripts/build/generate_pdf_browser.py &
          python scripts/build/generate_share_image.py &
          wait

      - name: Run tests
        run: |
          pytest tests/ -v 2>&1 | tee /tmp/pytest-out.txt; exit ${PIPESTATUS[0]}

      - name: Sync files to public directory
        run: |
          mkdir -p public/.well-known
          cp index.html public/
          cp resume.pdf public/
          cp src/robots.txt public/
          cp src/sitemap.xml public/
          cp src/_headers public/
          cp src/404.html public/
          cp src/.well-known/security.txt public/.well-known/
          cp -r assets public/
          cp src/history.html public/
          echo "✅ Synced files to public/ directory"

      - name: Attest build artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            public/index.html
            public/resume.pdf

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy public/ --project-name=tom-irish --commit-dirty=true
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Update version badge
        if: success()
        run: |
          git fetch --tags --quiet
          python3 - <<'PYEOF'
          import json, subprocess

          result = subprocess.run(
              ['git', 'tag', '--sort=-version:refname'],
              capture_output=True, text=True
          )
          tags = [t for t in result.stdout.strip().splitlines() if t]
          version = tags[0] if tags else 'untagged'

          payload = json.dumps({
              'schemaVersion': 1,
              'label': 'Version',
              'message': version,
              'color': '0075D8',
              'labelColor': '343B42',
              'namedLogo': 'git',
              'logoColor': '959DA5',
          })
          subprocess.run([
              'gh', 'api', '--method', 'PATCH',
              '/gists/bc255ee73cc388023f3a53becc895a80',
              '--field', f'files[version.json][content]={payload}',
          ], check=True)
          PYEOF
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Create deployment summary
        if: success()
        run: |
          TEST_RESULT=$(grep -oE '[0-9]+ passed in [0-9.]+s' /tmp/pytest-out.txt | tail -1 || echo 'unknown')
          SHA="${{ github.sha }}"
          echo "## 🚀 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your site is now live at: **https://tom.irish**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Tests passed: ✅ ($TEST_RESULT)" >> $GITHUB_STEP_SUMMARY
          echo "- Resume validated: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- HTML generated: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- PDF and share image generated: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Public directory synced: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed to Cloudflare Pages: ✅ (\`${SHA:0:7}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts attested: ✅ ([provenance](${{ steps.attest.outputs.attestation-url }}))" >> $GITHUB_STEP_SUMMARY

      - name: Create failure summary
        if: failure()
        run: |
          echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The build did not complete. Check the step logs above to see which step failed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Common causes:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests failed** — a script change broke existing behaviour" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation failed** — resume.md is missing a required section" >> $GITHUB_STEP_SUMMARY
          echo "- **Conversion failed** — index.html is missing an expected element ID" >> $GITHUB_STEP_SUMMARY
          echo "- **PDF generation failed** — Playwright/Chromium error or port conflict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**The live site has not been updated.**" >> $GITHUB_STEP_SUMMARY

  # LIGHTHOUSE, AFTER EVERY DEPLOY (2026-11-06; replaced nightly.yml). The
  # scores only change when the site does, so a nightly re-measured an
  # unchanged page. A separate job that needs `build`: the deploy is never
  # delayed, and a Lighthouse failure never blocks or rolls back a deploy. It
  # reports: accessibility and SEO are `error` in .lighthouserc.json, so a
  # regression turns THIS job red and GitHub emails.
  #
  # It measures the LIVE site (https://tom.irish), Cloudflare edge included,
  # which is what visitors get. Scores go to scores.json in the Lighthouse
  # gist, which the RPi reads for the tom.irish dashboard (no token needed:
  # gists are public). No README badge since 2026-11-06: the build badge goes
  # red when this job fails, and the scores are in the run summary.
  lighthouse:
    name: Lighthouse (live site)
    needs: build
    runs-on: ubuntu-latest
    # ~1 minute healthy (30s settle + 3 runs).
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Pages can serve the previous version for a few seconds after
      # `wrangler pages deploy` returns.
      - name: Let the deploy settle
        run: sleep 30

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # The per-run table on the run page (the old nightly's, brought back
      # 2026-11-06). The last column is BEST, not the average: it is the number
      # lhci's assertions judge and the one published to scores.json and the
      # dashboard, so all three agree.
      - name: Lighthouse summary
        if: always()
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os

          def badge(score):
              if score >= 90: return '\U0001f7e2'
              if score >= 50: return '\U0001f7e1'
              return '\U0001f534'

          labels = {'performance': 'Performance', 'accessibility': 'Accessibility',
                    'best-practices': 'Best Practices', 'seo': 'SEO'}
          print('## \U0001f526 Lighthouse\n')
          files = sorted(glob.glob('.lighthouseci/lhr-*.json'))
          if not files:
              print('\u26a0\ufe0f No Lighthouse results found')
              raise SystemExit(0)
          scores = {}
          for f in files:
              with open(f) as fh:
                  for key, cat in json.load(fh).get('categories', {}).items():
                      if cat.get('score') is not None:
                          scores.setdefault(key, []).append(round(cat['score'] * 100))
          n = len(files)
          print('| Category |' + ''.join(f' Run {i+1} |' for i in range(n)) + ' Best |')
          print('|---|' + '---|' * n + '---|')
          for key in labels:
              vals = scores.get(key)
              if vals:
                  cells = ''.join(f' {badge(v)} {v} |' for v in vals)
                  print(f'| {labels[key]} |{cells} {badge(max(vals))} **{max(vals)}** |')
          try:
              links = json.loads(os.environ.get('LH_LINKS') or '{}')
          except ValueError:
              links = {}
          for url, report in links.items():
              print(f'\n[Full report for {url}]({report})')
          PYEOF
        env:
          LH_LINKS: ${{ steps.lighthouse.outputs.links }}

      - name: Publish scores
        if: always()
        run: |
          python3 - <<'PYEOF'
          import datetime, glob, json, os, subprocess

          cats = ('performance', 'accessibility', 'best-practices', 'seo')
          runs = []
          for f in glob.glob('.lighthouseci/lhr-*.json'):
              with open(f) as fh:
                  runs.append(json.load(fh).get('categories', {}))
          # BEST of the runs, not the average: lhci's assertions use its default
          # "optimistic" aggregation (the best run), so publishing an average let
          # the dashboard ring go red (perf 91) on a run lhci passed (2026-11-06).
          scores = {}
          for c in cats:
              vals = [r[c]['score'] for r in runs if r.get(c, {}).get('score') is not None]
              if vals:
                  scores[c] = round(100 * max(vals))

          ok = os.environ.get('LIGHTHOUSE_OUTCOME') == 'success'
          # Absent categories stay absent: a missing score must never read as 0
          # or as a pass on the dashboard.
          record = {
              'schema': 1,
              'measured_at': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
              'commit': os.environ.get('GITHUB_SHA', ''),
              'runs': len(runs),
              'aggregation': 'best',
              'assertions_passed': ok,
              'scores': scores,
          }
          subprocess.run([
              'gh', 'api', '--method', 'PATCH',
              '/gists/cfcbef4e90b3367512488562c649334e',
              '--field', f'files[scores.json][content]={json.dumps(record)}',
          ], check=True)
          print(json.dumps(record, indent=2))
          PYEOF
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          LIGHTHOUSE_OUTCOME: ${{ steps.lighthouse.outcome }}
