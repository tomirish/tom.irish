name: CodeQL

on:
  push:
    branches: [main]
    # Same narrow docs-only skip as build.yml — named paths, never '*.md'.
    paths-ignore: ['todo.md', 'CLAUDE.md', 'docs/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 6'  # Weekly, Saturday midnight UTC

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
