[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Rule set is pinned explicitly so it does not drift when ruff bumps its
# defaults between releases (a 0.15 -> 0.16 default change is what surfaced this).
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM", "UP", "PIE", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings — intentional typography (×, em dash)
    "RUF002",  # ambiguous unicode in docstrings — same
    "RUF003",  # ambiguous unicode in comments — same
]
